<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Log in · NovaBank</title>
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/static/css/style.css" />
  </head>
  <body>
    <div class="auth-page">
      <form class="auth-card" id="login-form">
        <div class="brand" style="margin-bottom: 1rem">Nova<span>Bank</span></div>
        <h1>Log in</h1>
        <label for="email">Email</label>
        <input id="email" name="email" type="email" required autocomplete="username" />
        <label for="password">Password</label>
        <input id="password" name="password" type="password" required autocomplete="current-password" />
        <button class="btn" type="submit" style="width: 100%; margin-top: 1.25rem">Log in</button>
        <p class="form-error hidden" id="error"></p>
        <p class="muted" style="margin-top: 1rem">
          No account? <a href="/register">Register</a>
        </p>
      </form>
    </div>
    <script src="/static/js/api.js"></script>
    <script>
      if (getToken()) window.location.href = "/dashboard";
      document.getElementById("login-form").addEventListener("submit", async (e) => {
        e.preventDefault();
        const error = document.getElementById("error");
        error.classList.add("hidden");
        try {
          const data = await api("/api/auth/login", {
            method: "POST",
            body: JSON.stringify({
              email: document.getElementById("email").value,
              password: document.getElementById("password").value,
            }),
          });
          setToken(data.token);
          window.location.href = data.user.role === "ADMIN" ? "/admin" : "/dashboard";
        } catch (err) {
          error.textContent = err.message;
          error.classList.remove("hidden");
        }
      });
    </script>
  </body>
</html>
